<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Aura Décor</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Jost',sans-serif; background:#F5F5F5; color:#333; }
        .sidebar {
            position:fixed; top:0; left:0; width:240px; height:100vh;
            background:#0D0B08; padding:32px 0;
            display:flex; flex-direction:column;
        }
        .sidebar-logo { color:#C9A84C; font-size:20px; font-weight:700; padding:0 24px 32px; border-bottom:1px solid rgba(255,255,255,0.06); }
        .sidebar nav { padding: 24px 0; }
        .sidebar a { display:flex; align-items:center; gap:10px; padding:12px 24px; color:rgba(255,255,255,0.55); font-size:14px; text-decoration:none; transition:all 0.2s; }
        .sidebar a:hover, .sidebar a.active { color:#C9A84C; background:rgba(201,168,76,0.06); border-left:2px solid #C9A84C; }
        .main { margin-left:240px; padding:40px; min-height:100vh; }
        .page-title { font-size:28px; font-weight:600; margin-bottom:8px; }
        .page-sub { color:#999; font-size:14px; margin-bottom:32px; }
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:40px; }
        .stat-card { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .stat-card .num { font-size:32px; font-weight:700; color:#C9A84C; }
        .stat-card .lbl { font-size:12px; color:#999; margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
        .section-card { background:white; border-radius:12px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:24px; }
        .section-card h3 { font-size:16px; font-weight:600; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #F0F0F0; }
        table { width:100%; border-collapse:collapse; }
        th { text-align:left; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#999; padding:10px 16px; background:#FAFAFA; border-radius:4px; }
        td { padding:14px 16px; font-size:14px; border-bottom:1px solid #F5F5F5; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#FAFAFA; }
        .badge { padding:4px 12px; border-radius:40px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; display:inline-block; }
        .badge-pending { background:#FEF3C7; color:#92400E; }
        .badge-confirmed { background:#D1FAE5; color:#065F46; }
        .badge-completed { background:#DBEAFE; color:#1E40AF; }
        .badge-cancelled { background:#FEE2E2; color:#991B1B; }
        .action-btn { padding:6px 14px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-weight:600; transition:all 0.2s; }
        .confirm-btn { background:#C9A84C; color:white; }
        .confirm-btn:hover { background:#B8963A; }
        .cancel-btn { background:#FEE2E2; color:#991B1B; margin-left:6px; }
        .cancel-btn:hover { background:#FECACA; }
        #msgBox { display:none; padding:12px 20px; border-radius:8px; margin-bottom:20px; font-size:14px; }
        .msg-success { background:#D1FAE5; color:#065F46; border:1px solid #6EE7B7; }
        .msg-error { background:#FEE2E2; color:#991B1B; border:1px solid #FCA5A5; }
        .empty-state { text-align:center; padding:60px 20px; color:#999; font-size:15px; }
        @media(max-width:768px) { .sidebar{display:none} .main{margin-left:0} .stats-row{grid-template-columns:1fr 1fr} }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">✦ Aura Décor</div>
    <nav>
        <a href="#" class="active" onclick="showTab('bookings')">📋 Bookings</a>
        <a href="#" onclick="showTab('contacts')">✉️ Messages</a>
        <a href="index.html">🌐 View Website</a>
    </nav>
</div>

<div class="main">
    <div class="page-title">Admin Dashboard</div>
    <div class="page-sub">Manage bookings, messages and enquiries</div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="num" id="totalBookings">-</div><div class="lbl">Total Bookings</div></div>
        <div class="stat-card"><div class="num" id="pendingCount">-</div><div class="lbl">Pending</div></div>
        <div class="stat-card"><div class="num" id="confirmedCount">-</div><div class="lbl">Confirmed</div></div>
        <div class="stat-card"><div class="num" id="messagesCount">-</div><div class="lbl">Messages</div></div>
    </div>

    <div id="msgBox"></div>

    <!-- BOOKINGS TAB -->
    <div id="bookingsTab" class="section-card">
        <h3>📋 All Bookings</h3>
        <div id="bookingsTable"><div class="empty-state">Loading bookings...</div></div>
    </div>

    <!-- CONTACTS TAB -->
    <div id="contactsTab" class="section-card" style="display:none;">
        <h3>✉️ Contact Messages</h3>
        <div id="contactsTable"><div class="empty-state">Loading messages...</div></div>
    </div>
</div>

<script>
function showTab(tab) {
    document.getElementById('bookingsTab').style.display = tab === 'bookings' ? 'block' : 'none';
    document.getElementById('contactsTab').style.display = tab === 'contacts' ? 'block' : 'none';
    document.querySelectorAll('.sidebar a').forEach((a,i) => a.classList.toggle('active', i === (tab === 'bookings' ? 0 : 1)));
}

async function loadBookings() {
    try {
        const res = await fetch('php/admin_api.php?action=get_bookings');
        const data = await res.json();
        if (!data.success) { document.getElementById('bookingsTable').innerHTML = '<div class="empty-state">Failed to load bookings.</div>'; return; }
        
        document.getElementById('totalBookings').textContent = data.data.length;
        document.getElementById('pendingCount').textContent = data.data.filter(b => b.status === 'pending').length;
        document.getElementById('confirmedCount').textContent = data.data.filter(b => b.status === 'confirmed').length;

        if (!data.data.length) { document.getElementById('bookingsTable').innerHTML = '<div class="empty-state">No bookings yet.</div>'; return; }

        let html = `<table><thead><tr><th>#ID</th><th>Client</th><th>Event</th><th>Date</th><th>Venue</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
        data.data.forEach(b => {
            html += `<tr>
                <td><strong>#${b.id}</strong></td>
                <td>${b.client_name}<br><small style="color:#999">${b.email}</small></td>
                <td>${b.event_type}</td>
                <td>${b.event_date}</td>
                <td>${b.venue}</td>
                <td>${b.guest_count}</td>
                <td><span class="badge badge-${b.status}">${b.status}</span></td>
                <td>
                    ${b.status === 'pending' ? `<button class="action-btn confirm-btn" onclick="updateStatus(${b.id},'confirmed')">Confirm</button>` : ''}
                    ${b.status !== 'cancelled' && b.status !== 'completed' ? `<button class="action-btn cancel-btn" onclick="updateStatus(${b.id},'cancelled')">Cancel</button>` : ''}
                    ${b.status === 'confirmed' ? `<button class="action-btn confirm-btn" onclick="updateStatus(${b.id},'completed')" style="background:#3B82F6;margin-left:6px">Done</button>` : ''}
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('bookingsTable').innerHTML = html;
    } catch(e) {
        document.getElementById('bookingsTable').innerHTML = '<div class="empty-state">Error loading data. Make sure PHP server is running.</div>';
    }
}

async function loadContacts() {
    try {
        const res = await fetch('php/admin_api.php?action=get_contacts');
        const data = await res.json();
        document.getElementById('messagesCount').textContent = data.data ? data.data.length : 0;
        if (!data.data || !data.data.length) { document.getElementById('contactsTable').innerHTML = '<div class="empty-state">No messages yet.</div>'; return; }
        let html = `<table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr></thead><tbody>`;
        data.data.forEach(c => {
            html += `<tr><td>${c.name}</td><td>${c.email}</td><td>${c.message}</td><td>${c.created_at}</td></tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('contactsTable').innerHTML = html;
    } catch(e) {}
}

async function updateStatus(id, status) {
    const formData = new FormData();
    formData.append('id', id);
    formData.append('status', status);
    const res = await fetch('php/admin_api.php?action=update_booking', { method:'POST', body:formData });
    const data = await res.json();
    const msg = document.getElementById('msgBox');
    msg.style.display = 'block';
    msg.className = data.success ? 'msg-success' : 'msg-error';
    msg.textContent = data.message;
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
    if (data.success) loadBookings();
}

loadBookings();
loadContacts();
</script>
</body>
</html>
